# Lab d'integration local : client -> passerelle (mitmproxy + addon) -> Squid -> faux Copilot.
# Trois reseaux internes, sans acces Internet. Donnees synthetiques uniquement.
name: copilot-pii-lab

x-app: &app
  build:
    context: ..
    dockerfile: lab/Dockerfile
  image: copilot-pii-lab:dev

x-gateway: &gateway
  <<: *app
  command: ["/app/lab/gateway.sh"]
  networks: [client, egress]
  volumes:
    - pki:/pki:ro
  depends_on:
    pki: {condition: service_completed_successfully}
    corp-proxy: {condition: service_healthy}
  healthcheck:
    # Canari reel sur la boucle locale : sain seulement si l'addon repond ready=true.
    test: ["CMD", "python", "/app/check_proxy.py"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  pki:
    <<: *app
    command: ["python", "/app/lab/pki.py", "/pki"]
    network_mode: none
    volumes:
      - pki:/pki

  fake-copilot:
    <<: *app
    command: ["python", "/app/lab/fake_copilot.py"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    networks:
      upstream:
        aliases: [api.business.githubcopilot.com]
    volumes:
      - pki:/pki:ro
      - recordings:/recordings
    depends_on:
      pki: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 443), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  corp-proxy:
    build:
      context: ..
      dockerfile: lab/Dockerfile.squid
    image: copilot-pii-lab-squid:dev
    networks: [egress, upstream]
    depends_on:
      fake-copilot: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway-block:
    <<: *gateway
    environment:
      LAB_MODE: block

  gateway-redact:
    <<: *gateway
    environment:
      LAB_MODE: redact
      # Literal avec guillemet et antislash : verifie l'echappement JSON des alias.
      LAB_POLICY_PATCH: '{"literals": ["CLIENT_DEMO_CONFIDENTIEL", "Projet \"Alpha\\Beta\""]}'

  # C1 : instance redact neuve, mapping toujours vide (redemarrage, perte du mapping).
  gateway-fresh:
    <<: *gateway
    environment:
      LAB_MODE: redact

  # F2 : proxy d'entreprise injoignable (nom non resolu), aucune sortie directe possible.
  gateway-noproxy:
    <<: *gateway
    environment:
      LAB_MODE: block
      LAB_UPSTREAM: http://corp-proxy-down:3128

  # F5 : detecteur externe factice (fake_worker.py) a la place de Presidio.
  gateway-presidio:
    <<: *gateway
    environment:
      LAB_MODE: block
      LAB_POLICY_PATCH: '{"presidio_language": "en", "presidio_model": "fake", "presidio_python": "/app/lab/fake_python.sh", "presidio_timeout_ms": 1000, "presidio_max_restarts": 20}'

  # F3 : script charge depuis un volume partage, casse a chaud par les tests.
  gateway-hot:
    <<: *gateway
    environment:
      LAB_MODE: block
      LAB_HOT_DIR: /hot
    volumes:
      - pki:/pki:ro
      - hot:/hot

  # F4 : demarrage refuse si la politique est invalide ou si scripts est present.
  startup-check:
    <<: *app
    profiles: [faults]
    network_mode: none
    volumes:
      - pki:/pki:ro
    command:
      - sh
      - -c
      - |
        check() {
          env "$$@" timeout 20 /app/lab/gateway.sh
          code=$$?
          if [ $$code -eq 0 ] || [ $$code -eq 124 ]; then
            echo "FAIL: gateway started ($$*, exit $$code)"; exit 1
          fi
          echo "OK: gateway refused to start ($$*, exit $$code)"
        }
        check 'LAB_POLICY_PATCH={"exact_hosts": "x"}'
        check LAB_ADD_SCRIPTS=1

  tests:
    <<: *app
    profiles: [test]
    command: ["python", "/app/lab/test_lab.py"]
    networks: [client]
    volumes:
      - pki:/pki:ro
      - recordings:/recordings:ro
      - hot:/hot
    depends_on:
      gateway-block: {condition: service_healthy}
      gateway-redact: {condition: service_healthy}
      gateway-fresh: {condition: service_healthy}
      gateway-noproxy: {condition: service_healthy}
      gateway-presidio: {condition: service_healthy}
      gateway-hot: {condition: service_healthy}

networks:
  client: {internal: true}
  egress: {internal: true}
  upstream: {internal: true}

volumes:
  pki:
  recordings:
  hot:
