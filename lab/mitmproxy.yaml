# Configuration mitmproxy du lab (copiee dans le confdir par gateway.sh).
listen_host: 0.0.0.0
listen_port: 8080
mode:
  - upstream:http://corp-proxy:3128
allow_hosts:
  - '^(.+\.)?githubcopilot\.com:443$'
  - '^copilot-proxy\.githubusercontent\.com:443$'
connection_strategy: lazy
flow_detail: 0
ssl_insecure: false
ssl_verify_upstream_trusted_ca: /pki/lab-ca.pem
